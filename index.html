<title>Math Sprout</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --ground:#F2F4F8; --surface:#FFFFFF; --line:#DCE2EB; --line-2:#C7CFDB;
  --ink:#1F2A44; --ink-2:#3E4964; --slate:#5E6A80; --slate-bg:#E8ECF2; --slate-ink:#3F4A5E;
  --hot:#E4572E; --hot-t:#B23A15; --warm:#F29E4C; --warm-t:#A45610; --ember:#B5651D; --ember-t:#8C4C12; --rest:#9AA0A6; --rest-t:#5F656C;
  --gold:#E8B923; --gold-t:#8A6500; --violet:#7C5CBF; --violet-t:#5E3FA3; --violet-bg:#EFEAF8;
  --correct:#2E9E5B; --correct-t:#1C7542; --correct-bg:#E6F4EC; --notyet:#4A7FC1; --notyet-t:#2E5E9C; --notyet-bg:#E8F0FA;
  --display:"Lexend", "Atkinson Hyperlegible", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Lexend", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px; --r-sm:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.45; padding-inline:16px; padding-block:20px 40px}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--notyet); outline-offset:2px; border-radius:8px}
.layout{display:grid; grid-template-columns:minmax(0,480px); justify-content:center; gap:28px; align-items:start}
@media (min-width:1080px){ .layout{grid-template-columns:minmax(0,480px) minmax(0,440px)} }

/* ---------- the child's app ---------- */
.app{background:var(--surface); border:1px solid var(--line); border-radius:24px; min-height:640px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 1px 0 var(--line), 0 18px 40px -28px rgba(31,42,68,.35)}
.screen{display:flex; flex-direction:column; flex:1; padding:22px 22px 24px; gap:18px}
.eyebrow{font-family:var(--display); font-size:12px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--slate)}
h1,h2,h3{font-family:var(--display); margin:0; text-wrap:balance; letter-spacing:-.01em}
.btn{appearance:none; border:0; border-radius:var(--r); background:var(--ink); color:#fff; font-family:var(--display); font-weight:600; font-size:19px; padding:16px 20px; cursor:pointer; width:100%; transition:transform .08s ease, background .15s}
.btn:hover{background:#2A3858} .btn:active{transform:translateY(1px)}
.btn[disabled]{background:var(--line-2); color:#fff; cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line-2)}
.link{appearance:none; background:none; border:0; padding:6px 0; font-family:var(--display); font-weight:500; font-size:15px; color:var(--ink-2); cursor:pointer; align-self:flex-start}
.link:hover{color:var(--ink)}

/* setup */
.setup h1{font-size:30px; line-height:1.15}
.field{display:flex; flex-direction:column; gap:8px}
.field label{font-family:var(--display); font-weight:500; font-size:15px}
.field input{font:inherit; font-size:20px; padding:12px 14px; border:1.5px solid var(--line-2); border-radius:var(--r-sm); background:var(--surface); color:var(--ink)}
.seg{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.seg button{appearance:none; border:1.5px solid var(--line-2); background:var(--surface); border-radius:var(--r-sm); padding:12px 0; font-family:var(--display); font-weight:600; font-size:18px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:#fff}
.note{font-size:15px; color:var(--slate); margin:0}

/* home — fixed order: greeting, focus, band, CTA, strip, Badges */
.home{justify-content:flex-start; gap:0}
.home .hi{font-size:22px; font-weight:500; color:var(--ink-2); margin-bottom:34px}
.home .focus-name{font-size:34px; line-height:1.1; font-weight:600; margin:8px 0 12px}
.band{display:inline-flex; align-items:center; gap:8px; font-family:var(--display); font-weight:500; font-size:16px; color:var(--slate-ink)}
.band .dots{display:inline-flex; gap:4px}
.band .dots i{width:9px; height:9px; border-radius:50%; background:var(--line-2)}
.band .dots i.on{background:var(--ink)}
.home .cta{margin-top:auto; display:flex; flex-direction:column; gap:14px; padding-top:40px}
.home .step-note{font-size:14px; color:var(--slate); text-align:center; margin-top:-4px}
.home .badges-link{margin-top:18px; align-self:center}

/* fuel strip — read-only, never a button */
.fuel{display:flex; justify-content:center; align-items:center; gap:16px; flex-wrap:wrap; font-family:var(--display); font-weight:500; font-variant-numeric:tabular-nums; font-size:15px; color:var(--ink-2); user-select:none}
.fuel .f{display:inline-flex; align-items:center; gap:6px}
.fuel svg{width:20px; height:20px; flex:none}
.fuel .sep{width:3px; height:3px; border-radius:50%; background:var(--line-2)}
.fuel.slim{gap:10px; font-size:13.5px}
.fuel.slim svg{width:16px; height:16px}
.fuel .flame-hot{color:var(--hot-t)} .fuel .flame-warm{color:var(--warm-t)} .fuel .flame-ember{color:var(--ember-t)} .fuel .flame-resting,.fuel .flame-none{color:var(--rest-t)}
.fuel .xp{color:var(--gold-t)} .fuel .pc{color:var(--violet-t)}
.pulse{animation:pulse .9s ease 1}
@keyframes pulse{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}

/* practice */
.practice{padding:0; gap:0}
.bar{display:flex; flex-wrap:wrap; align-items:center; gap:10px 12px; padding:12px 16px 12px; border-bottom:1px solid var(--line)}
.bar .fuel{margin-left:auto; justify-content:flex-end}
.bar .x{appearance:none; border:0; background:var(--slate-bg); width:34px; height:34px; border-radius:50%; cursor:pointer; display:grid; place-items:center; flex:none}
.bar .x svg{width:14px; height:14px}
.progress{display:flex; gap:3px; flex:1 0 100%; order:3; min-width:0}
.progress i{flex:1; height:5px; border-radius:3px; background:var(--slate-bg)}
.progress i.done{background:var(--ink-2)} .progress i.now{background:var(--ink-2); opacity:.35}
.qhead{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:16px 20px 0; flex-wrap:wrap}
.concept{font-family:var(--display); font-weight:600; font-size:16px; color:var(--ink-2)}
.chips{display:flex; gap:6px; align-items:center}
.diff{display:inline-flex; align-items:center; gap:7px; background:var(--slate-bg); color:var(--slate-ink); border-radius:999px; padding:4px 10px 4px 9px; font-family:var(--display); font-size:13px; font-weight:600}
.diff .bars{display:inline-flex; gap:2px; align-items:flex-end}
.diff .bars i{width:4px; border-radius:1px; background:#B7C0CE}
.diff .bars i:nth-child(1){height:6px} .diff .bars i:nth-child(2){height:9px} .diff .bars i:nth-child(3){height:12px}
.diff .bars i.on{background:var(--slate-ink)}
.lane{border-radius:999px; padding:4px 10px; font-family:var(--display); font-size:13px; font-weight:600; border:1.5px solid var(--line-2); color:var(--slate-ink)}

.stage{flex:1; display:flex; flex-direction:column; justify-content:center; padding:18px 20px 8px; min-height:220px}
.stem{font-family:var(--display); font-weight:600; font-size:clamp(30px, 8.5vw, 44px); line-height:1.25; letter-spacing:-.01em; font-variant-numeric:tabular-nums; text-align:center; overflow-wrap:anywhere}
.stem.prose{font-size:clamp(21px, 5.6vw, 26px); font-weight:500; line-height:1.4; text-align:left}
.stem.prose .blank-row{display:flex; justify-content:center; margin-top:18px; font-size:1.55em; font-weight:600}
.frac{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 .08em; line-height:1}
.frac > span{display:block; padding:0 .12em}
.frac > span:first-child{border-bottom:.07em solid currentColor; padding-bottom:.06em}
.frac > span:last-child{padding-top:.06em}
.stem .frac{font-size:.78em}
.stem.prose .frac{font-size:.95em}
.whole{margin-right:.08em}
.blank{display:inline-flex; align-items:center; justify-content:center; min-width:1.7em; height:1.3em; padding:0 .2em; border:.075em solid var(--ink); border-radius:.18em; vertical-align:middle; color:var(--ink); background:var(--surface); font-variant-numeric:tabular-nums}
.frac .blank{min-width:1.3em; height:1.15em; font-size:.95em}
.blank.empty::after{content:""; width:.06em; height:.8em; background:var(--ink); animation:blink 1.1s steps(1) infinite}
.blank.sel{background:var(--slate-bg)}
.blank.done-c{border-color:var(--correct); color:var(--correct-t)}
.blank.done-n{border-color:var(--notyet); color:var(--notyet-t)}
@keyframes blink{50%{opacity:0}}
.col{display:inline-grid; grid-template-columns:auto auto; justify-items:end; column-gap:.35em; row-gap:.05em; font-size:1em}
.col .op{justify-self:start}
.col .rule{grid-column:1/-1; justify-self:stretch; border-top:.07em solid var(--ink); margin:.08em 0 .12em}
.col .res{grid-column:1/-1}
.hint{margin:14px auto 0; font-size:16px; color:var(--slate); text-align:center; min-height:1.45em}

.pad{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:12px 16px 16px; background:var(--ground); border-top:1px solid var(--line)}
.pad button{appearance:none; border:1px solid var(--line); background:var(--surface); border-radius:12px; min-height:54px; font-family:var(--display); font-weight:500; font-size:24px; cursor:pointer; box-shadow:0 1px 0 var(--line); touch-action:manipulation}
.pad button:active{transform:translateY(1px); box-shadow:none}
.pad button.k-sm{font-size:15px; font-weight:600; color:var(--ink-2)}
.pad .spacer{visibility:hidden}
.pad .check{grid-column:span 2; background:var(--ink); color:#fff; border-color:var(--ink); font-weight:600; font-size:19px}
.pad .check[disabled]{background:var(--line-2); border-color:var(--line-2); cursor:not-allowed}
.pad .zero{grid-column:span 2}

/* feedback */
.fb{border-top:1px solid var(--line); padding:18px 20px 20px; display:flex; flex-direction:column; gap:14px; animation:rise .22s ease both}
@keyframes rise{from{transform:translateY(8px); opacity:.2}to{transform:none; opacity:1}}
.verdict{display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:24px}
.verdict .mark{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; flex:none}
.verdict .mark svg{width:18px; height:18px}
.verdict.c{color:var(--correct-t)} .verdict.c .mark{background:var(--correct); color:#fff}
.verdict.n{color:var(--notyet-t)} .verdict.n .mark{background:var(--notyet); color:#fff}
.beats{display:flex; flex-direction:column; gap:11px; margin:0}
.beat{display:grid; grid-template-columns:7.2em 1fr; gap:10px; align-items:baseline}
.beat dt{font-family:var(--display); font-size:12px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--slate)}
.beat dd{margin:0; font-size:17px}
.beat.lock dd{font-family:var(--display); font-weight:600; font-variant-numeric:tabular-nums}
@media (max-width:420px){ .beat{grid-template-columns:1fr; gap:2px} }
.chip{display:inline-flex; align-items:center; gap:8px; align-self:flex-start; background:var(--slate-bg); color:var(--slate-ink); border-radius:999px; padding:6px 12px; font-family:var(--display); font-weight:600; font-size:14px}
.chip.full{background:var(--ink); color:#fff; animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.85)}to{transform:none}}
.reward{display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; font-family:var(--display); font-weight:600; font-size:15px; font-variant-numeric:tabular-nums}
.reward span{display:inline-flex; align-items:center; gap:5px}
.reward svg{width:16px; height:16px}
.reward .rx{color:var(--gold-t)} .reward .rf{color:var(--hot-t)} .reward .rp{color:var(--violet-t)} .reward .rb{color:var(--ink)}

/* interstitials */
.center{justify-content:center; text-align:center; align-items:center; gap:16px}
.center h2{font-size:28px; line-height:1.15}
.center p{margin:0; max-width:30ch; color:var(--ink-2)}
.center .btn{max-width:320px}
.sprout{width:132px; height:150px}
.levelup .step-jump{display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:600}
.levelup .step-jump .diff{font-size:14px}

/* lane choice */
.lanes{display:flex; flex-direction:column; gap:10px}
.lane-opt{appearance:none; display:grid; grid-template-columns:28px 1fr auto; align-items:center; gap:12px; text-align:left; border:1.5px solid var(--line-2); background:var(--surface); border-radius:var(--r); padding:14px 16px; cursor:pointer}
.lane-opt .t{font-family:var(--display); font-weight:600; font-size:18px}
.lane-opt .d{font-size:15px; color:var(--slate)}
.lane-opt .radio{width:22px; height:22px; border-radius:50%; border:2px solid var(--line-2)}
.lane-opt[aria-checked="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.lane-opt[aria-checked="true"] .radio{border:7px solid var(--ink)}
.lane-opt[disabled]{opacity:.5; cursor:not-allowed}
.lane-opt .left{font-family:var(--display); font-size:13px; font-weight:600; color:var(--slate)}

/* session end */
.end h2{font-size:28px}
.end .rchips{display:flex; flex-wrap:wrap; gap:8px}
.rchip{display:inline-flex; align-items:center; gap:7px; border:1.5px solid var(--line); border-radius:999px; padding:7px 13px; font-family:var(--display); font-weight:600; font-size:15px; font-variant-numeric:tabular-nums}
.rchip svg{width:18px; height:18px}
.end .facts{font-size:15px; color:var(--slate)}
.end .tick{font-family:var(--display); font-weight:500; font-size:18px; display:flex; gap:10px; align-items:flex-start}
.end .tick svg{width:20px; height:20px; flex:none; margin-top:3px; color:var(--slate-ink)}

/* badges */
.goal{display:grid; grid-template-columns:150px 1fr; gap:18px; align-items:center; background:var(--violet-bg); border-radius:var(--r); padding:14px 18px}
.goal h3{font-size:19px} .goal p{margin:4px 0 10px; color:var(--ink-2); font-size:15px}
.pieces{display:flex; flex-wrap:wrap; gap:6px; list-style:none; padding:0; margin:0}
.pieces li{font-family:var(--display); font-size:13px; font-weight:600; border-radius:999px; padding:4px 10px; background:var(--surface); color:var(--slate)}
.pieces li.got{background:var(--violet); color:#fff}
.skills{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.skills li{display:grid; grid-template-columns:28px 1fr auto; gap:10px; align-items:center; padding:11px 2px; border-bottom:1px solid var(--line)}
.skills li:last-child{border-bottom:0}
.skills .nm{font-family:var(--display); font-weight:500; font-size:16px}
.skills .bl{font-family:var(--display); font-size:13.5px; font-weight:500; color:var(--slate)}
.skills .medal{width:24px; height:24px}
.skills li.locked .nm{color:var(--slate)}
@media (max-width:420px){ .goal{grid-template-columns:1fr; justify-items:center; text-align:center} .goal .pieces{justify-content:center} }

/* ---------- behind the glass ---------- */
.glass{font-family:var(--body); font-size:14px; display:flex; flex-direction:column; gap:16px; color:var(--ink-2)}
.glass header h2{font-size:20px} .glass header p{margin:4px 0 0; font-size:14px; color:var(--slate)}
.gcard{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
.gcard h3{font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--slate)}
.grow{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.gbtn{appearance:none; border:1px solid var(--line-2); background:var(--surface); border-radius:9px; padding:7px 11px; font-family:var(--display); font-weight:500; font-size:13.5px; cursor:pointer; color:var(--ink)}
.gbtn:hover{border-color:var(--ink)}
.gbtn.warn{color:var(--hot-t)}
.gtoggle{display:flex; gap:8px; align-items:center; font-size:14px}
.gtoggle input{width:18px; height:18px; accent-color:var(--ink)}
.gsel{font:inherit; font-size:13.5px; padding:6px 8px; border-radius:8px; border:1px solid var(--line-2); background:var(--surface); color:var(--ink); max-width:100%}
.tbl-wrap{overflow-x:auto}
.tbl{border-collapse:collapse; width:100%; font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums}
.tbl th{text-align:left; font-weight:500; color:var(--slate); padding:4px 8px 4px 0; border-bottom:1px solid var(--line); white-space:nowrap}
.tbl td{padding:4px 8px 4px 0; border-bottom:1px solid var(--slate-bg); white-space:nowrap}
.tbl td.w{white-space:normal; font-family:var(--body); font-size:13px}
.tbl tr.dim td{color:var(--rest-t)}
.tag{display:inline-block; font-family:var(--mono); font-size:11px; border-radius:5px; padding:1px 5px; background:var(--slate-bg); color:var(--slate-ink)}
.tag.qe-HonestAttempt{background:#FBF3D8; color:var(--gold-t)} .tag.qe-QualifyingPracticeDay{background:#FDE7DF; color:var(--hot-t)}
.tag.qe-BuildPieceUnlock{background:var(--violet-bg); color:var(--violet-t)} .tag.qe-MasteryBandTransition,.tag.qe-LevelUpSlight,.tag.qe-BadgeMilestone,.tag.qe-ConceptProgressTick{background:var(--ink); color:#fff}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.stat{background:var(--ground); border-radius:10px; padding:8px 10px}
.stat b{display:block; font-family:var(--display); font-size:20px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums}
.stat span{font-size:12px; color:var(--slate)}
.sample{font-size:13px; background:#FBF3D8; color:var(--gold-t); border-radius:9px; padding:8px 10px}
details.cfg summary{cursor:pointer; font-family:var(--display); font-weight:500}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important; transition:none!important} }

</style>
<div class="layout">
  <main class="app" id="app" aria-live="polite"></main>
  <aside class="glass" id="glass" aria-label="Behind the glass: engine inspector"></aside>
</div>
<script>
/* Math Sprout engine — rules-v1. Everything here plays the "server" role:
   generation, issuance, scoring, learner state, QualifyingEvent bus, ledger.
   The UI talks to it only through createServer(); item payloads never carry answers. */
(function (G) {
'use strict';

const CONFIG = {
  POLICY_VERSION: 'rules-v1',
  SESSION_ITEMS: 12,            // IA §7 directional 8–12
  MIX_SLOTS: [3, 6, 9, 11],     // 1-based slots filled by interleaved skills; the rest are focus
  QPD_K: 5,                     // honest attempts for a QualifyingPracticeDay (≥1 Recommended/Challenge)
  MIN_LATENCY_MS: 1000,         // below this an answer is not an HonestAttempt
  FAST_GUESS_MS: 2000,          // instrument only (ML note)
  RT_CAP_MS: 120000,            // response-time clamp (ML note, 4:44pm)
  NO_REPEAT_DAYS: 7,
  BAND_WINDOW: 8, BAND_MIN: 6, GETTING_IT: 0.6, GOT_IT: 0.85, GOT_IT_RUN: 3,
  STEP_UP_RUN: 3, STEP_DOWN_MISSES: 3, STEP_DOWN_WINDOW: 4,
  REVIEW_PER_WEEK: 2, REVIEW_XP_MULT: 0.4,
  XP: { correct: 10, challenge: 15, effort: 3, tick: 15, band: 30, levelUp: 25 },
  TICK_DELTA: 0.34, TICK_MIN: 6,
  PIECES_PER_GOAL: 5, FLAME_MILESTONES: [3, 7, 14],
  FOCUS_MAX_SESSIONS: 4,        // rotate focus if the band hasn't moved up in this many focus sessions
  POOL_FLOOR_TEMPLATE: 10, POOL_FLOOR_SKILL: 20, POOL_CAP: 80
};

/* ---------- small utilities ---------- */
function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
function rng(seed) { let a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
function R(n, d = 1) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; return { n: n / g, d: d / g }; }
const eqR = (a, b) => a.n * b.d === b.n * a.d;
function fmtR(r, form) {
  if (r.d === 1) return String(r.n);
  if (form === 'mixed' && r.n > r.d) return Math.floor(r.n / r.d) + ' ' + (r.n % r.d) + '/' + r.d;
  return r.n + '/' + r.d;
}
const digits = n => String(n).split('').map(Number).reverse();          // ones first
const fromDigits = ds => ds.reduceRight((acc, d) => acc * 10 + d, 0);
function colSumNoCarry(...ns) { const L = Math.max(...ns.map(n => String(n).length)); const out = []; for (let i = 0; i < L; i++) out.push(ns.reduce((s, n) => s + (digits(n)[i] || 0), 0) % 10); return fromDigits(out); }
function colSumConcat(a, b) { const L = Math.max(String(a).length, String(b).length); let s = ''; for (let i = L - 1; i >= 0; i--) s += String((digits(a)[i] || 0) + (digits(b)[i] || 0)); return Number(s); }
function colDiff(a, b) { const L = String(a).length; const out = []; for (let i = 0; i < L; i++) out.push(Math.abs((digits(a)[i] || 0) - (digits(b)[i] || 0))); return fromDigits(out); }
function carries(a, b) { let c = 0, n = 0; const L = Math.max(String(a).length, String(b).length); for (let i = 0; i < L; i++) { const s = (digits(a)[i] || 0) + (digits(b)[i] || 0) + c; c = s >= 10 ? 1 : 0; n += c; } return n; }
function borrows(a, b) { let br = 0, n = 0; const L = String(a).length; for (let i = 0; i < L; i++) { const t = (digits(a)[i] || 0) - br - (digits(b)[i] || 0); br = t < 0 ? 1 : 0; n += br; } return n; }
const PLACE = ['ones', 'tens', 'hundreds', 'thousands', 'ten thousands'];
const fmtN = n => n >= 1000 ? n.toLocaleString('en-US') : String(n);
const B = '▢';   // blank marker inside stems

/* ---------- time ---------- */

/* ---------- the server ---------- */
function freshState(name, grade) {

function createServer(state, clock) {

}
function finish() { ui.end = server.endSession(ui.sessionId); ui.screen = 'end'; ui.pulse = ui.minted || ui.end.xpGained > 0; render(); }
function press(k) {
  if (ui.fb) return; const frac = ui.item.answerKind === 'fraction'; let t = ui.sel ? '' : ui.typed; ui.sel = false; ui.hint = '';
  if (k === 'back') t = t.slice(0, -1);
  else if (/^\d$/.test(k)) { if (t.length < 9) t += k; }
  else if (k === '/' && frac) { if (t && !t.includes('/') && !t.endsWith(' ')) t += '/'; }
  else if (k === ' ' && frac) { if (t && !t.includes(' ') && !t.includes('/')) t += ' '; }
  ui.typed = t; render();
}
function check() {
  if (ui.fb || !ui.typed) return;
  const r = server.submit(ui.item.iid, ui.typed, performance.now() - ui.shownAt);
  if (r.kind === 'format_rejected') { ui.hint = r.hint; ui.sel = true; render(); return; }
  ui.fb = r; if (r.mintedIds && r.mintedIds.length) ui.minted = true; render();
  const b = $app.querySelector('.fb .btn'); if (b) b.focus({ preventScroll: true });
}
function next() { if (ui.fb && ui.fb.levelUp) { ui.screen = 'levelup'; render(); return; } nextItem(); }

/* ---------- events ---------- */
$app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act;
  if (a === 'grade') { ui.setupGrade = +el.dataset.g; render(); }
  else if (a === 'setup-go') { const n = (document.getElementById('setup-name').value || 'Leo').trim().slice(0, 20) || 'Leo'; state = M.freshState(n, ui.setupGrade); server = M.createServer(state); ui.screen = 'home'; render(); }
  else if (a === 'start') { const h = server.homeView(); if (h.laneOffer) { ui.lane = 'recommended'; ui.screen = 'lanes'; render(); } else begin('recommended'); }
  else if (a === 'lane') { ui.lane = el.dataset.lane; render(); }
  else if (a === 'go') begin(ui.lane);
  else if (a === 'key') press(el.dataset.k);
  else if (a === 'check') check();
  else if (a === 'next') next();
  else if (a === 'after-levelup') nextItem();
  else if (a === 'quit') { const hadAny = state.attempts.some(x => x.sessionId === ui.sessionId); if (hadAny) finish(); else { server.endSession(ui.sessionId); ui.screen = 'home'; render(); } }
  else if (a === 'home') { ui.screen = 'home'; render(); }
  else if (a === 'badges') { ui.screen = 'badges'; render(); }
});
document.addEventListener('keydown', e => {
  if (ui.screen !== 'practice' || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (ui.fb) { if (e.key === 'Enter' && document.activeElement && !document.activeElement.closest('.fb')) { e.preventDefault(); next(); } return; }
  if (/^\d$/.test(e.key) || e.key === '/') { e.preventDefault(); press(e.key); }
  else if (e.key === ' ') { e.preventDefault(); press(' '); }
  else if (e.key === 'Backspace') { e.preventDefault(); press('back'); }
  else if (e.key === 'Enter') { e.preventDefault(); check(); }
});

/* ---------- behind the glass ---------- */
function renderGlass() {
  if (ui.screen === 'setup') { $glass.innerHTML = `<header><h2>Behind the glass</h2><p>Set up a child to start. The engine starts empty.</p></header>`; return; }
  const d = server.inspect(); const t = new Date(server.now());
  const when = t.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  const off = d.clock.dayOffset;
  $glass.innerHTML = `
  <header><h2>Behind the glass</h2><p>What the engine sees. The child never sees this panel. It stands in for the server, the event log and the dogfood readout.</p></header>
  ${state.sample ? `<div class="sample">Sample data: ${esc(state.child.name)} has five simulated days of practice, with one missed day. Start fresh to begin with an empty child.</div>` : ''}
  <div class="gcard"><h3>Clock</h3>
    <div>Today is <b>${when}</b>${off ? ` (${off > 0 ? '+' : ''}${off} day${Math.abs(off) === 1 ? '' : 's'} from real time)` : ''}. The flame reads only qualifying days.</div>
    <div class="grow"><button class="gbtn" data-g="day1">Next day</button><button class="gbtn" data-g="day2">Skip 2 days</button><button class="gbtn" data-g="day0">Back to real today</button></div></div>
  <div class="gcard"><h3>Controls</h3>
    <label class="gtoggle"><input type="checkbox" id="g-lanes" ${state.dev.alwaysOfferLanes ? 'checked' : ''}> Offer the lane choice before every session</label>
    <div class="grow"><label for="g-focus">Focus</label><select class="gsel" id="g-focus"><option value="">Auto (next up: ${esc(M.SKILL[d.focus].name)})</option>${M.SKILLS.map(s => `<option value="${s.id}" ${state.dev.focusOverride === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div>
    <div class="grow"><button class="gbtn" data-g="sim">Simulate a session</button><button class="gbtn" data-g="sample">Load sample week</button><button class="gbtn warn" data-g="fresh">Start fresh</button></div></div>
  <div class="gcard"><h3>Totals</h3><div class="stats">
    ${[['attempts', d.totals.attempts], ['honest', d.totals.honest], ['XP (ledger sum)', d.totals.xp], ['qualifying days', d.totals.qpd], ['format rejects', d.totals.rejects], ['fast guesses <2s', d.totals.fastGuess]].map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('')}</div></div>
  <div class="gcard"><h3>Learner state · ${esc(d.config.POLICY_VERSION)}</h3><div class="tbl-wrap"><table class="tbl">
    <tr><th>skill</th><th>band</th><th>step</th><th>evid.</th><th>fresh / pool</th></tr>
    ${d.skills.map(s => `<tr class="${s.open ? '' : 'dim'}"><td>${s.id}${s.id === d.focus ? ' ◆' : ''}</td><td>${s.open ? s.band : 'locked'}</td><td>${s.step}</td><td>${s.evidence}</td><td>${s.fresh} / ${s.pool}</td></tr>`).join('')}</table></div>
    <p class="note" style="font-size:12.5px">◆ = focus. Evidence is the band window (last ${d.config.BAND_WINDOW} Recommended/Challenge attempts). Fresh = unseen in 7 days at the current step.</p></div>
  <div class="gcard"><h3>QualifyingEvent bus (newest first)</h3><div class="tbl-wrap"><table class="tbl">
    <tr><th>day</th><th>event</th><th>skill</th><th>xp</th></tr>
    ${d.events.length ? d.events.map(e => { const l = state.ledger.find(x => x.eventId === e.id); return `<tr><td>${e.day.slice(5)}</td><td><span class="tag qe-${e.type}">${e.type}</span></td><td>${e.skill || (e.reason || '')}</td><td>${l ? '+' + l.xp : ''}</td></tr>`; }).join('') : '<tr><td colspan="4" class="w">Nothing minted yet.</td></tr>'}</table></div></div>
  <div class="gcard"><h3>Issuance log (newest first)</h3><div class="tbl-wrap"><table class="tbl">
    <tr><th>template</th><th>step</th><th>lane</th><th>issue_reason</th><th>evid.</th></tr>
    ${d.issued.map(i => `<tr><td>${i.tpl}</td><td>${i.step}</td><td>${i.lane.slice(0, 4)}</td><td>${i.reason}</td><td>${i.evidence ? 'yes' : 'no'}</td></tr>`).join('')}</table></div></div>
  <div class="gcard"><details class="cfg"><summary>Config stubs</summary><div class="tbl-wrap"><table class="tbl" style="margin-top:8px">
    ${Object.entries(d.config).filter(([k]) => !/POOL_CAP/.test(k)).map(([k, v]) => `<tr><td>${k}</td><td class="w">${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</td></tr>`).join('')}</table></div></details></div>`;
}
$glass.addEventListener('click', e => {
  const b = e.target.closest('[data-g]'); if (!b) return; const g = b.dataset.g;
  if (g === 'day1' || g === 'day2') { state.dayOffset += g === 'day1' ? 1 : 2; if (ui.screen === 'practice' || ui.screen === 'levelup') { server.endSession(ui.sessionId); } ui.screen = 'home'; }
  else if (g === 'day0') { state.dayOffset = 0; ui.screen = 'home'; }
  else if (g === 'sim') { M.simulateSession(server, { pBase: 0.82 }); ui.screen = 'home'; ui.pulse = true; }
  else if (g === 'sample') { state = makeSample(); server = M.createServer(state); ui.screen = 'home'; }
  else if (g === 'fresh') { try { localStorage.removeItem(KEY); } catch (err) {} ui.setupGrade = 3; ui.screen = 'setup'; }
  render();
});
$glass.addEventListener('change', e => {
  if (e.target.id === 'g-lanes') state.dev.alwaysOfferLanes = e.target.checked;
  if (e.target.id === 'g-focus') state.dev.focusOverride = e.target.value || null;
  if (ui.screen === 'home' || ui.screen === 'badges') render(); else { renderGlass(); save(); }
});

render();
})();

</script>
